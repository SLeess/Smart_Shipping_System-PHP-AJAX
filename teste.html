<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <title>Sistema 3S</title>
    <style>
        *{
            box-sizing: unset;
        }
        body{
            max-height: 96vh;
            background-image: url("_assets/background.png");
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-size: cover;
        }
        img{
            display: block; 
            width: 401px; 
            height: 182px; 
            margin: auto; 
            margin-top: 175px;
        }

        #btnLogin:hover div, 
        #btnCadastrar:hover a{
            background-color: red;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <img src="_assets/LOGO.png" alt="logo da 3S" />
    <div style="width: 294px; margin: auto;">
        <!-- width: 294px; height: 213px;  -->
        <div style="width: 294px; height: 233px; margin-left: 0px; padding-top: 0.1px; margin-top: 8px; background: #D9D9D9; border-radius: 20px">
            <!-- 197 -->
            <div style="width: 277px; height: 217px; margin-left: 8px; margin-top: 8px; background: #C6C6C6; border-radius: 20px;">
                <div id="linhaUser" style="width: 270px; margin-top: 34px; display: inline-block; margin-left: 10px;">
                    <span style="text-align: center; color: black; font-size: 16px; font-family: Inria Sans; font-weight: 700; word-wrap: break-word;">Usuário:</span>
                    
                    <input type="text" name="" id="" style="width: 188px; height: 35px; background: white; border-radius: 20px;" maxlength="20">
                </div>
                <div id="linhaSenha" style="width: 270px; margin-top: 7px; display: inline-block; margin-left: 22px;">
                    <span style="text-align: center; color: black; font-size: 16px; font-family: Inria Sans; font-weight: 700; word-wrap: break-word;">Senha:</span>
                    
                    <input type="text" name="" id="" style="width: 188px; height: 35px; background: white; border-radius: 20px;" maxlength="20">
                </div>
                <div style="width: 276px; display: inline-block; margin-top: 15px;">
                    <div id="btnLogin" style="width: 196px; height: 40px; background: #052685; border-radius: 20px; border: 5px #98A6CC solid; margin: auto;">
                        <div style="margin-left: 75px; margin-top: 12px; position: absolute; text-align: center; color: white; font-size: 16px; font-family: Inria Sans; font-weight: 700; word-wrap: break-word">
                            LOGIN
                        </div>
                    </div>
                </div>
                <div id="btnCadastrar" style="margin-top: 15px;">
                    <span style="margin: auto; margin-top: -12px; text-align: center; color: rgb(0, 0, 0); font-size: 12px; font-family: Inria Sans; font-weight: 700; word-wrap: break-word">
                        <a href="" class="nav-link active" style="color: #052685;">Cadastre-se aqui</a>
                    </span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
