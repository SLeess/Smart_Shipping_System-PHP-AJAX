<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="_style/style.css">
    <link rel="stylesheet" href="_style/loaders/loader2.css">
    <link rel="shortcut icon" href="_assets/favicon.ico" type="image/x-icon">

</head>
<body>
    <!--
        CRUD - WEB + INTERFACE + BD

        Create
        Read
        Update
        Delete
    -->
    <div class="hide login" id="conteudo">
        <div class="container">
            <div class="row">
                <div class="col-lg-4 offset-lg-4">
                    <div class="card formulario">
                        <div class="card-body">
                            <h3 style="text-align: center;">Login</h3>
                        </div>
                        <div class="card-body">
                            <form action="_php/CRUD/login.php" method="POST">
                                <div>
                                    <div class="mb-3">
                                        <label for="usuario">Usuário</label>
                                        <input type="text" name="usuario" id="usuario" class="form-control" placeholder="Nome de usuário" required pattern="[A-Za-z0-9._<>`´À-ÖØ-öø-ÿ ]+" oninput="this.value = this.value.replace(/[^A-Za-z0-9._`´À-ÖØ-öø-ÿ ]+/, '');">
                                    </div>
                                </div>
                                <div>
                                    <div class="mb-3">
                                        <label for="password">Senha</label>
                                        <input type="password" name="senha" id="senha" class="form-control" placeholder="*********" required pattern="[A-Za-z0-9]+">
                                    </div>
                                </div>
                                <div>
                                    <div class="mb-3">
                                        <button type="submit" class="btn btn-outline-primary"">Enviar</button>
                                        <a href="_php/cadastrar.php" class="btn btn-outline-primary">Cadastrar</a>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>

    <!---------FUNÇÃO DE LOADER---------->
    <div class="loader" id="loader">
        <!--<div class="c-loader"></div>-->
        <div class="c-loader"></div>
    </div>
    <script>
        var i = setInterval(function () {
            clearInterval(i);

            // O código desejado é apenas isto:
            document.getElementById("loader").classList.remove("loader");
            document.getElementById("loader").classList.add("hide");
            document.getElementById("conteudo").classList.remove("hide");
        }, 1500);
    </script>
    <!---------------------------------->
</body>
</html>
