<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="shortcut icon" href="assets/img/favicon.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="assets/js/geral.js"></script>
    <script src="assets/js/perfilConfiguracoes.js"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <style id="styles">
        input{
            margin-bottom: 10px;
        }

        .dash{
            max-width: 990px;
        }

        .buttons{
            margin-top: -200px;
        }
        @media (min-width: 992px) {
            #linha1{
                justify-content: center;
            }
            #linha1 img{
                width: 400px;
            }
        }
    </style>
</head>
<body>
    <div id="navbar"></div>
    <div class="container d-flex justify-content-center align-items-center" style="margin-top: -36px;">
        <div class="dash bg-white">
            <div class="p-3">
                <div id="titulo"></div>
                <div class="container bg-white mb-1">
                    <div class="row">
                        <div id="linha1" class="col-md-4 col-lg-5 border-right d-flex flex-column align-items-center">
                            <div class="text-center">
                                <img src="https://cdn-icons-png.flaticon.com/256/6596/6596121.png" alt="" width="225px" class="rounded-circle mt-4 d-block">
                                <span id="spSession" class="font-weight-bold d-block"></span>
                                <span id="spEmail" class="text-black-50 d-block"><br>&nbsp;</span>
                            </div>
                        </div>
                        <div class="col-md-8 offset-lg-1 col-lg-6 border-right">
                            <div class="p-2 py-3">
                                <div class="d-flex justify-content-between align-items-center mb-3">
                                    <h4 class="text-right">Configurações de Perfil</h4>
                                </div>
                                <div class="row mt-2">
                                    <div class="col-md-6 mt-1">
                                        <label class="labels">Nome</label>
                                        <input type="text" id="ipNome" name="nome" required pattern="[A-Za-z ]+" class="form-control" placeholder="Primeiro nome">
                                    </div>
                                    <div class="col-md-6 mt-1">
                                        <label class="labels">Sobrenome</label>
                                        <input type="text" id="ipSobrenome" name="sobrenome" required pattern="[A-Za-z ]+" class="form-control" placeholder="Sobrenome">
                                    </div>
                                    <div class="col-md-12 mt-1">
                                        <label class="labels">Email</label>
                                        <input type="text" id="ipEmail" name="email" required pattern=".*@.*\.com.*" class="form-control" placeholder="seuemail@dominio.com">
                                    </div>
                                </div>
                                <div class="row mt-3">
                                    <div class="col-md-12">
                                        <small id="userValidation" class="hide" style="margin-top: 0; color: rgba(255, 0, 0, 0.678);">
                                            Usuário já cadastrado!
                                        </small>
                                        <br>
                                        <label class="labels">Nome de usuário</label>
                                        <input type="text" id="newUser" name="usuario" class="form-control" placeholder="Username" required pattern="[A-Za-z0-9._`´À-ÖØ-öø-ÿ ]+">
                                    </div>

                                    <div class="col-md-6 mt-1"><label class="labels">Cep</label><input type="text" class="form-control" placeholder="Digite seu cep" value="" disabled></div>
                                    <div class="col-md-6 mt-1"><label class="labels">Estado</label><input type="text" class="form-control" placeholder="Nome do estado" value="" disabled></div>
                                    <div class="col-md-12 mt-1"><label class="labels">Bairro</label><input type="text" class="form-control" placeholder="Nome do bairro" value="" disabled></div>
                                    <div class="col-md-12 mt-1"><label class="labels">Cidade</label><input type="text" class="form-control" placeholder="Nome da cidade" value="" disabled></div>
                                    <div class="col-md-12 mt-1"><label class="labels">Referência</label><input type="text" class="form-control" placeholder="Referência" value="" disabled></div>
                                    <div class="col-md-12 mt-1"><label class="labels">Escolaridade</label><input type="text" class="form-control" placeholder="Nível de Escolaridade" value="" disabled></div>
                                </div>
                                <div class="row mt-6">
                                    <div class="col-md-6 mt-1"><label class="labels">País</label><input type="text" class="form-control" placeholder="Nome do país" value="" disabled></div>
                                    <div class="col-md-6 mt-1"><label class="labels">Região</label><input type="text" class="form-control" value="" placeholder="Nome da região" disabled></div>
                                </div>
                                <div class="row mt-6">
                                <div class="col-md-6 mt-1"><label class="labels">Data de Cadastro</label><input type="text" id="ipData" class="form-control" placeholder="Nome da região" disabled></div>
                                </div>
                                <div class="buttons mt-5 text-center">
                                    <button id="btnSalvar" class="btn btn-outline-primary profile-button" type="button">Salvar alterações</button>
                                    <button id="btnDesativar" class="btn btn-outline-danger profile-button" type="button">Desativar conta</button>
                                    <button ID="btnSair" class="btn btn-outline-secondary profile-button" type="button">Sair</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
