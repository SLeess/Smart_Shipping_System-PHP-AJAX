<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notas e Monitoramento</title>
    <link rel="shortcut icon" href="assets/img/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style id="styles">
        input[type=data], input[type=date]{
            margin: 5px 0;
        }
        .btns{
            margin-top: 35px;
            margin-bottom: 10px;
        }

        .btns,
        input,
        .form-control{
            max-width: 350px;
        }

        h2{
            margin-bottom: 30px;
            white-space: nowrap;
        }

        .dash{
            margin: auto;
            max-width: 920px;
            min-width: 330px;
        }
        
        @media (max-width: 995px) {
            .dash {
                margin-bottom: 35px;
            }
        }
    </style>
</head>
<body>
    <div id="navbar"></div>
    
    <div class="container d-flex justify-content-center align-items-center" style="margin-top: -35px;">
        <div class="dash col-lg-10 col-md-8 col-12 bg-white">
            <div class="row p-3">
                <div id="titulo"></div>
                <div class="input-group mb-3">
                    <button class="btn btn-outline-secondary" type="button" id="btnSelecionar">Selecionar</button>
                    <select class="form-select" id="inputGroupSelect03" aria-label="button addon">
                        <option selected>Escolha</option>
                        <option value="Aurora">Aurora - XML / Excel</option>
                        <option value="Cruzeiro">Cruzeiro - XML</option>
                        <option value="Suinco">Suinco - XML</option>
                        <option value="Plena">Plena - Excel</option>
                        <!-- <option value="5">Total</option> -->
                    </select>
                </div>
                <hr id='hr' class='hide'>
                <div class="Notas">
                    <div id="Aurora" class="hide container px-2 py-2 text-center">
                        <div class="row g-4 p-2 row-cols-1 row-cols-lg-2">
                            <div class="col-10 col-lg-6 mx-auto">
                                <h2>Escanear XML Aurora</h2>
                                <form id="xmlForm">
                                    <div id="inserir" class="scan">
                                        <div class="mb-3">
                                            <input style="width: 100%;" class="form-control" type="file" id="formFile" name="xmlFilesInput[]" accept=".xml" multiple required>
                                            <input style="width: 100%;" id="dataAurora" class="form-control" type="date" style="margin-top: 5px;" required >
                                            <button style="width: 100%;"  type="button" id="scanButtonAurora" class='btns btn btn-outline-secondary mt-2' style="width: 100%;">Escanear XMLs</button>
                                        </div>
                                    </div>
                                </form>
                                <div class="col-md-6 offset-md-3 mt-2">
                                    <div id="loadingAurora" class="hide">Carregando...</div>
                                    <progress id="progressBarAurora" class="hide" value="0" max="100"></progress>
                                </div>
                                <div id="outputAurora" class="mt-1"></div>
                            </div>
                            <div class="col-10 col-lg-6 offset-lg-0 mx-auto">
                                <h2>Escanear Excel Aurora</h2>
                                <p style='font-size: 17px; color: gray;margin-bottom: 11.3px;'>Datas de produção e validade</p>
                                <form id="xlsxFormAurora">
                                    <div class="mb-3">
                                        <input style="width: 100%;" class="form-control" type="file" id="fileInput" name="excel_file" accept=".xlsx" required>
                                        <input style="width: 100%;" type="submit" id="enviarAurora" class="btns btn btn-outline-secondary d-inline-block mt-2" style="width: 100%;" value="Escanear XLSXs">
                                    </div>
                                </form>
                                <div id="outputAuroraExcel" class="mt-1"></div>
                            </div>
                        </div>
                    </div>
                    <div id="Cruzeiro" class="hide container-fluid px-2 py-2 text-center">
                        <div class="hide row g-4 py-2 row-cols-1 row-cols-lg-1">
                            <div class="col">
                                    <h2>Escanear XML Cruzeiro</h2>
                                    <form id="xmlFormCruzeiro">
                                        <div id="inserir" class="scan">
                                            <div class="col-md-6 offset-md-3 mb-3">
                                                <input style="width: 100%;" class="form-control" type="file" id="fileInput" name="xmlCruzeiroFilesInput[]" accept=".xml" multiple required>
                                                <input style="width: 100%;" id="dataCruzeiro" type="date" class="form-control" required >
                                                <input style="width: 100%;" id="cargaCruzeiro" type="number" class="form-control" placeholder="Digite a Carga:" required>
                                                <button style="width: 100%;"  type="button" id="scanButtonCruzeiro" class="btns btn btn-outline-secondary mt-2">Escanear XMLs</button>
                                            </div>
                                        </div>
                                    </form>
                                    <div id="loadingCruzeiro" class="hide">Carregando...</div>
                                    <progress id="progressBarCruzeiro" class="hide" value="0" max="100"></progress>
                            </div>
                            <div id="outputCruzeiro"></div>
                        </div>
                    </div>                    
                    <div id="Plena" class="hide container-fluid px-2 py-2 text-center">
                        <div class="hide row g-4 py-2 row-cols-1 row-cols-lg-1">
                            <div class="col">
                                <h2>Escanear Excel Plena</h2>
                                <form enctype="multipart/form-data" id="plenaForm">
                                    <div id="inserir" class="scan">
                                        <div class="col-md-6 offset-md-3 mb-3">
                                            <input style="width: 100%;" class="form-control" type="file" id="inputPlena" name="excel_file" accept=".xlsx" required>
                                            <input style="width: 100%;" id="dataPlena" type="date" class="form-control" required/>
                                            <input style="width: 100%;" id="cargaPlena" class="form-control" type="number" placeholder="Digite a Carga:" required>
                                            <input style="width: 100%;" type="submit" value="Escanear XLSXs" class="btns btn btn-outline-secondary mt-2">
                                        </div>
                                    </div>
                                </form>
                            </div>
                            <div id="outputPlena"></div>
                        </div>
                    </div>
                    <div id="Suinco" class="hide container-fluid px-2 py-2 text-center">
                        <div class="hide row g-4 py-2 row-cols-1 row-cols-lg-1">
                            <div class="col">
                                <h2>Escanear XML Suinco</h2>
                                <form id="xmlFormSuinco">
                                    <div id="inserir" class="scan">
                                        <div class="col-md-6 offset-md-3 mb-3">
                                            <input style="width: 100%;" class="form-control" type="file" id="InputSuinco" name="xmlSuincoFilesInput[]" accept=".xml" multiple required>
                                            <input style="width: 100%;" id="dataSuinco" type="date" class="form-control" required>
                                            <input style="width: 100%;" id="cargaSuinco" type="number" class="form-control" placeholder="Digite a Carga:" required>
                                            <button style="width: 100%;"  type="button" id="scanButtonSuinco" class="btns btn btn-outline-secondary mt-2">Escanear XMLs</button>
                                        </div>
                                    </div>
                                </form>
                                <div id="loadingSuinco" class="hide">Carregando...</div>
                                <progress id="progressBarSuinco" class="hide" value="0" max="100"></progress>
                                <div id="outputSuinco"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
<script src="assets/js/geral.js"></script>
<script src="assets/js/setNotas.js"></script>
</body>
</html>
